# GitHub Actions workflow to build and release public firmware for various ESP devices using ESPHome.
name: Release public firmware

on:
  push:
    branches:
      - release
      - "release-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  build:
    name: Build ${{ matrix.device }}
    if: github.ref != 'refs/heads/release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - wemos-d1-mini
          - nodemcuv2
          - esp32-devkit
          - esp32-s2
          - esp32-s3
          - esp32-c3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Cache ESPHome and PlatformIO downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ matrix.device }}-${{ hashFiles('firmwares/p1meter_common.yaml', 'firmwares/public/p1meter_public.yaml', format('firmwares/public/devices/{0}.yaml', matrix.device)) }}
          restore-keys: |
            esphome-${{ env.ESPHOME_VERSION }}-${{ matrix.device }}-

      - name: Validate configuration
        run: esphome config firmwares/public/devices/${{ matrix.device }}.yaml

      - name: Compile firmware
        run: esphome compile firmwares/public/devices/${{ matrix.device }}.yaml

      - name: Collect firmware files
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          mkdir -p release
          build_dir=$(dirname "$(find firmwares/public/devices/.esphome/build -name firmware.ota.bin -print -quit)")
          ota="$build_dir/firmware.ota.bin"
          factory="$build_dir/firmware.factory.bin"
          [ -f "$factory" ] || factory="$build_dir/firmware.bin"
          if cmp -s "$factory" "$ota"; then
            cp "$ota" "release/${DEVICE}-firmware.bin"
          else
            cp "$factory" "release/${DEVICE}-firmware.bin"
            cp "$ota" "release/${DEVICE}-firmware.ota.bin"
          fi
          ls -l release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.device }}
          path: release/*.bin
          if-no-files-found: error

  tag:
    name: Tag build
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create and push build tag
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          tag="${version}-build.${GITHUB_RUN_NUMBER}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download artifacts from release-v build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          git fetch --force --tags origin
          tag=$(git tag -l "${version}-build.*" --sort=-version:refname | head -n1)
          if [ -z "$tag" ]; then
            echo "No build tag ${version}-build.* found, build the release-v* branch first" >&2
            exit 1
          fi
          sha=$(git rev-list -n1 "$tag")
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/release-public-firmware.yml" and .conclusion == "success") | .id' | head -n1)
          if [ -z "$run_id" ]; then
            echo "No successful build run found for $tag ($sha)" >&2
            exit 1
          fi
          gh run download "$run_id" --pattern 'firmware-*' --dir firmware
          find firmware -mindepth 2 -name '*.bin' -exec mv {} firmware/ \;
          ls -l firmware

      - name: Read release version
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          awk -v v="$RELEASE_VERSION" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release delete "$RELEASE_VERSION" --yes --cleanup-tag
          fi
          gh release create "$RELEASE_VERSION" firmware/*.bin \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --prerelease \
            --notes-file release-notes.md
