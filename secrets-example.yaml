# Your Wi-Fi SSID and password
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
# MQTT broker
mqtt_broker: "YOUR_MQTT_BROKER"
mqtt_username: "YOUR_MQTT_USERNAME"
mqtt_password: "YOUR_MQTT_PASSWORD"
# Your ESPHome API encryption key - Base64 32-byte key; replace with the output of: openssl rand -base64 32
p1_meter__encryption_key: "QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVowMTIzNDU="
# OTA password for ESPHome
p1meter__ota_password: "YOUR_OTA_PASSWORD"
# Setup Wi-Fi password for AP mode - WPA password for the AP mode MUST be at least 8 characters long
p1_meter__setup_wifi_password: "YOUR_SETUP_WIFI_PASSWORD"