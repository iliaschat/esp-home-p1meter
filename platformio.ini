; PlatformIO IDE project for the P1 Meter firmwares.
;
; The firmware itself is built by ESPHome (see scripts/build.sh), so each
; environment only adds "P1 Meter:" custom targets to the PlatformIO IDE
; project tasks: Compile, Upload, Logs, Validate and Clean.
;
; Environment names are <firmware>-<device>, for example public-wemos-d1-mini
; or advanced-esp32-s3. The default "Build" action does nothing; use
; "P1 Meter: Compile" instead.

[platformio]
default_envs = public-wemos-d1-mini

[env]
platform = native
extra_scripts = pre:scripts/pio_targets.py

[env:public-wemos-d1-mini]
[env:public-nodemcuv2]
[env:public-esp32-devkit]
[env:public-esp32-s2]
[env:public-esp32-s3]
[env:public-esp32-c3]

[env:advanced-wemos-d1-mini]
[env:advanced-nodemcuv2]
[env:advanced-esp32-devkit]
[env:advanced-esp32-s2]
[env:advanced-esp32-s3]
[env:advanced-esp32-c3]
