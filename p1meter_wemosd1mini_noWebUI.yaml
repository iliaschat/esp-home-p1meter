# Standard firmware: no Web UI, Wi-Fi and MQTT from secrets.yaml, ESPHome API encryption and ESPHome OTA.
esphome:
  name: p1-meter
  project:
    name: p1meter.firmware
    version: 0.3.1 (Standard)
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: return id(mqtt_enabled);
          then:
            - mqtt.enable:

external_components:
  - source: ./components
    components: [dsmr]

globals:
  - id: mqtt_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

esp8266:
  board: d1_mini

wifi:
  # output_power: 10dBm # Set WiFi output power to 10dBm if facing connectivity issues
  # use_address: 192.168.1.x # enable static IP if needed
  ssid: !secret wifi_ssid # Wi-Fi SSID
  password: !secret wifi_password # Wi-Fi password
  on_connect:
    - switch.turn_on: wifi_led

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker # MQTT broker address
  username: !secret mqtt_username # MQTT username
  password: !secret mqtt_password # MQTT password
  enable_on_boot: false
  reboot_timeout: 0s

api:
  reboot_timeout: 30min
  encryption:
    key: !secret p1_meter__encryption_key # P1 meter encryption key

uart:
  rx_pin:
    number: GPIO3
    inverted: true
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 2048

dsmr:
  crc_check: false

sensor:
  - platform: dsmr
    energy_delivered_tariff1:
      name: "Energy Consumed Tariff 1"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_delivered_tariff2:
      name: "Energy Consumed Tariff 2"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff1:
      name: "Energy Returned Tariff 1"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff2:
      name: "Energy Returned Tariff 2"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    power_delivered:
      name: "Power Consumed"
      unit_of_measurement: kW
      device_class: power
    power_returned:
      name: "Power Returned"
      unit_of_measurement: kW
      device_class: power
    power_delivered_l1:
      name: "Power Consumed Phase 1"
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
    power_delivered_l2:
      name: "Power Consumed Phase 2"
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
    power_delivered_l3:
      name: "Power Consumed Phase 3"
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
    current_l1:
      name: "Current Phase 1"
      unit_of_measurement: A
      device_class: current
      state_class: measurement
    current_l2:
      name: "Current Phase 2"
      unit_of_measurement: A
      device_class: current
      state_class: measurement
    current_l3:
      name: "Current Phase 3"
      unit_of_measurement: A
      device_class: current
      state_class: measurement
    voltage_l1:
      name: "Voltage Phase 1"
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
    voltage_l2:
      name: "Voltage Phase 2"
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
    voltage_l3:
      name: "Voltage Phase 3"
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
    gas_delivered:
      name: "Gas Consumed"
      unit_of_measurement: m³
      device_class: gas
      state_class: total_increasing
    electricity_failures:
      name: "Short Power Outages"
      state_class: total_increasing
    electricity_long_failures:
      name: "Long Power Outages"
      state_class: total_increasing
    electricity_sags_l1:
      name: "Short Power Drops Phase 1"
      state_class: total_increasing
    electricity_swells_l1:
      name: "Short Power Peaks Phase 1"
      state_class: total_increasing

text_sensor:
  - platform: dsmr
    identification:
      name: "P1 Meter ID"
    p1_version:
      name: "P1 Version"
    electricity_tariff:
      name: "Actual Tariff Group"
  - platform: template
    name: "Firmware Version"
    lambda: return std::string("0.3.1 (Standard)");

switch:
  - platform: gpio
    id: wifi_led
    pin:
      number: GPIO2
      inverted: true
    internal: true
  - platform: template
    name: "MQTT"
    id: mqtt_switch
    lambda: return id(mqtt_enabled);
    turn_on_action:
      - globals.set:
          id: mqtt_enabled
          value: "true"
      - mqtt.enable:
    turn_off_action:
      - globals.set:
          id: mqtt_enabled
          value: "false"
      - mqtt.disable:
  - platform: restart
    name: "Reboot"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - switch.toggle: wifi_led

ota:
  - platform: esphome
    password: !secret p1meter__ota_password

logger:
  level: INFO
  baud_rate: 0